name: Release

# Triggered by a version tag like `v0.5.0`. The tag must match the crate
# versions in Cargo.toml (`[workspace.package].version`).
#
# Procedure:
#   1. bump `version` in `[workspace.package]` (+ any `[Unreleased]` →
#      released section in CHANGELOG.md), commit.
#   2. `git tag v0.5.0 && git push origin v0.5.0`
#   3. This workflow publishes the two crates (proc-macro first, then the
#      umbrella `agent_oxide` that depends on it), then creates a GitHub
#      Release.  Publishing is idempotent: a version that is already on
#      crates.io (e.g. published locally with a personal token) is
#      skipped.  For CI publishing, add a `CARGO_REGISTRY_TOKEN` secret
#      to the repository.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "error: tag v$TAG_VERSION does not match workspace version $CARGO_VERSION" >&2
            exit 1
          fi

      - name: Publish crates (proc-macro first, then umbrella; skip versions already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          for crate in agent-oxide-macros agent_oxide; do
            # --registry crates-io is essential: without it, `cargo info`
            # resolves against the local workspace first, and the checkout
            # ALWAYS contains this exact version (workspace member /
            # path dependency) — the check would be trivially true and
            # publishing would never run.
            if cargo info "$crate@$version" --registry crates-io >/dev/null 2>&1; then
              echo "── $crate $version already on crates.io — skipping"
            else
              echo "── publishing $crate $version"
              cargo publish -p "$crate"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
