[package]
name = "agent_oxide"
version = "0.5.1"
edition = "2024"
description = "Agent Oxide — a modular agent framework for Rust (ReAct engine, LLM providers, tools, sandbox, persistence, skills, NOOA ergonomics)"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# Proc macros — #[derive(Agent)], #[agent_impl], #[tool].
agent-oxide-macros = { version = "0.5.1", path = "agent_oxide-macros" }
futures-core = { workspace = true }
futures-executor = { workspace = true }
futures-util = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
schemars = { workspace = true }
# `rc` is needed for `Arc<T>: Serialize` (serde moved Rc/Arc impls behind
# the optional `rc` feature) — `#[context(dynamic)]` fields are typically
# shared via `Arc<RwLock<...>>`.
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = "0.5"
futures-util = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "bench"
harness = false

[workspace]
members = ["agent_oxide-macros"]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nie-Tianyi/agent_oxide"
keywords = ["agent", "llm", "react", "framework", "ai"]
categories = ["asynchronous", "development-tools"]
rust-version = "1.88"

[workspace.dependencies]
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.0", features = ["full"] }
futures-core = "0.3"
futures-executor = "0.3"
futures-util = "0.3.32"
regex = "1"
schemars = { version = "1", features = ["derive"] }
glob = "0.3"
tempfile = "3"
toml = "1.1"
tracing = "0.1"
serde_yaml = "0.9"
time = { version = "0.3", features = ["macros", "formatting", "local-offset"] }
