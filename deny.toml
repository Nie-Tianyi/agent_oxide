# cargo-deny configuration — license, ban, and advisory policy.
# Local check:  cargo deny check
# CI:           .github/workflows/ci.yml (deny job)

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
# cargo-deny 0.18+ schema: vulnerability/notice severities were removed
# (those advisories now always error); `unmaintained` is a scope enum
# (all | workspace | transitive | none), not a severity.
db-path = "$CARGO_HOME/advisory-dbs"
unmaintained = "workspace"
yanked = "warn"

[licenses]
# Common permissive licenses used across the dependency tree.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "BSL-1.0",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.8
# `unlicensed` was removed in cargo-deny 0.20: licenses not in `allow` are
# denied implicitly; use `clarify` for crates that need manual attribution.

[bans]
multiple-versions = "warn"
wildcards = "deny"
