# cargo-deny configuration — license, ban, and advisory policy.
# Local check:  cargo deny check
# CI:           .github/workflows/ci.yml (deny job)

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
# Database freshness window; ignored when the cache is missing (CI installs
# the latest db via cargo-deny's fetch).
db-path = "$CARGO_HOME/advisory-dbs"
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"

[licenses]
# Common permissive licenses used across the dependency tree.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "BSL-1.0",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.8
unlicensed = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
